name: Java real-model evaluation
on:
  workflow_dispatch:
    inputs:
      model:
        description: Provider model ID (prefer a pinned version)
        required: true
        type: string
      base_url:
        description: OpenAI-compatible provider base URL
        required: true
        default: https://api.openai.com
        type: string
      repetitions:
        description: Repetitions per scenario (each may make up to four model calls)
        default: '1'
        type: choice
        options: ['1', '3', '5']
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: javaaiagent
    env:
      RUN_LIVE_EVALS: 'true'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_MODEL: ${{ inputs.model }}
      EVAL_BASE_URL: ${{ inputs.base_url }}
      EVAL_REPETITIONS: ${{ inputs.repetitions }}
      EVAL_INPUT_USD_PER_MILLION: ${{ vars.EVAL_INPUT_USD_PER_MILLION }}
      EVAL_OUTPUT_USD_PER_MILLION: ${{ vars.EVAL_OUTPUT_USD_PER_MILLION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode -Dtest=LiveModelEvaluationTest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-model-evaluation-${{ github.run_id }}
          path: javaaiagent/target/evals/*.json
          if-no-files-found: warn
