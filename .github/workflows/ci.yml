name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyaiagent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff check --config pyproject.toml ../scripts
      - run: uv run pytest -q
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javaaiagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goaiagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: goaiagent/go.mod
          cache-dependency-path: goaiagent/go.sum
      - run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/ ./cmd/goaiagent
