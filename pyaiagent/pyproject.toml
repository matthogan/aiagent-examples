[project]
name = "jagent"
version = "0.1.0"
description = "A minimal A2A and LangGraph operations agent with enterprise security examples"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=0.3,<0.4",
    "httpx>=0.28,<1",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "pydantic-settings>=2,<3",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
