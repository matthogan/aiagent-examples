spring.application.name=javaaiagent
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=10s
server.tomcat.max-http-form-post-size=16KB
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.default-property-inclusion=non_null
agent.environment=${ENVIRONMENT:local}
agent.model-mode=${MODEL_MODE:demo}
agent.llm-model=${LLM_MODEL:gpt-4.1-mini}
agent.openai-api-key=${OPENAI_API_KEY:}
agent.url=${AGENT_URL:http://127.0.0.1:8080/}
agent.auth-mode=${AUTH_MODE:demo}
agent.demo-token=${DEMO_TOKEN:local-demo-client-token}
agent.jwt-public-key-file=${JWT_PUBLIC_KEY_FILE:}
agent.jwt-issuer=${JWT_ISSUER:https://identity.example.com/}
agent.jwt-audience=${JWT_AUDIENCE:jagent}
agent.status-url=${STATUS_URL:http://127.0.0.1:8081}
agent.runbook-url=${RUNBOOK_URL:http://127.0.0.1:8082}
agent.status-token=${STATUS_TOKEN:local-demo-status-token}
agent.runbook-token=${RUNBOOK_TOKEN:local-demo-runbook-token}
logging.level.org.springframework.ai=WARN
logging.level.org.bsc.langgraph4j=WARN
