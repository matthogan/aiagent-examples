# Template: replace URLs and mount trusted keys; provide secrets via environment.
# Load with --spring.config.additional-location=file:config/production.properties
agent.environment=production
agent.model-mode=openai
agent.auth-mode=jwt
agent.url=https://agent.example.com/
agent.status-url=https://status.internal.example.com
agent.runbook-url=https://runbooks.internal.example.com
agent.jwt-public-key-file=/run/secrets/issuer-public.pem
agent.jwt-issuer=https://identity.example.com/
agent.jwt-audience=jagent
agent.openai-api-key=${OPENAI_API_KEY}
agent.status-token=${STATUS_TOKEN}
agent.runbook-token=${RUNBOOK_TOKEN}
